name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ocaml/setup-ocaml@605a7e998e76e035b82c14d618a6e1010732c4ce # v3
        with:
          ocaml-compiler: 5.3.0
          dune-cache: true
      - run: opam install . --deps-only
      - run: opam exec -- dune build --profile release bin/main.exe
      - name: Stage binary and verify version
        shell: bash
        run: |
          mkdir -p dist
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          name="binlens-$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')-$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')$suffix"
          cp _build/default/bin/main.exe "dist/$name"
          "dist/$name" version | grep "binlens ${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.os }}-${{ runner.arch }}
          path: dist
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binary-*
          path: artifacts
      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f -name 'binlens-*' -exec cp {} release/ \;
          git archive --format=tar.gz --prefix="binlens-${GITHUB_REF_NAME#v}/" --output="release/binlens-${GITHUB_REF_NAME#v}-source.tar.gz" "$GITHUB_REF_NAME"
          (cd release && sha256sum * > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --notes-file docs/RELEASE_NOTES_0.1.0.md --title "BinLens $GITHUB_REF_NAME"
